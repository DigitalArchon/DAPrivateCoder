<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Everything is served from this origin: nothing remote, no inline script. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>DA Private Coder</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="top">
  <img src="/static/icon.svg" alt="" class="logo">
  <div class="title">
    <div class="name">DA Private Coder</div>
    <div id="status" class="status"><span class="dot"></span><span id="status-text">Starting…</span></div>
  </div>
  <!-- drawn here rather than a ⟳ character, which some systems' fonts draw as a bracket -->
  <button id="refresh-btn" class="icon-btn" title="Look again" aria-label="Look again"><svg viewBox="0 0 24 24" width="18" height="18"
    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
</header>
<div id="banner" class="banner hidden"></div>
<main id="page"></main>
<div id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
